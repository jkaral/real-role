name: Security Review

# Claude reviews each PR's diff for vulnerabilities and comments on the PR.
# https://github.com/anthropics/claude-code-security-review
# Not hardened against prompt injection: run it on trusted PRs only. Fork PRs don't get the
# secret (plain `pull_request`, never `pull_request_target`), and the repo requires approval
# before workflows run for outside contributors.

on:
  pull_request:

permissions:
  pull-requests: write # leave review comments
  contents: read

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    name: Claude security review
    # Skip fork PRs (no secret available) instead of failing them.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      # Skip (with a notice) until the CLAUDE_API_KEY repo secret is set, instead of failing.
      - id: key
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: |
          if [ -n "$CLAUDE_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::CLAUDE_API_KEY is not set; skipping the Claude security review."; fi
      # Pinned to a commit (main as of 2026-02-11) so the reviewer can't change underneath us.
      - uses: anthropics/claude-code-security-review@0c6a49f1fa56a1d472575da86a94dbc1edb78eda
        if: steps.key.outputs.present == 'true'
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          claude-model: claude-opus-5-5
          exclude-directories: demo/output,apps/extension/store,docs
          custom-security-scan-instructions: .github/security-review/scan-instructions.txt
          false-positive-filtering-instructions: .github/security-review/false-positives.txt
