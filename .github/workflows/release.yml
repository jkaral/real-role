name: Release

# On a v* tag: run the checks, build the production extension zip and attach it
# to a GitHub Release with install-unpacked instructions.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: extension release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the zip
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build Chrome Web Store zip (production API)
        run: pnpm --filter @real-role/extension zip
      - name: Test the release verifier
        run: node --test scripts/*.test.mjs
      # Tag/version, production-only hosts, reviewed permissions and CSP, required files, no demo
      # or fixture content, and no API path the deployed backend answers with 404 (backend first).
      - name: Verify the zip
        run: >
          node scripts/verify-extension-release.mjs --tag "$GITHUB_REF_NAME" --check-backend
          --checksum-out apps/extension/.output/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip=$(ls apps/extension/.output/real-role-extension-*-chrome.zip)
          cat > notes.md <<'EOF'
          ## Install the Real Role extension (beta)

          Until the Chrome Web Store listing is live, install it unpacked:

          1. Download `real-role-extension-*-chrome.zip` below and unzip it into a folder you'll keep.
          2. Open `chrome://extensions` and turn on **Developer mode** (top right).
          3. Click **Load unpacked** and pick the unzipped folder (the one containing `manifest.json`).
          4. Pin Real Role from the puzzle-piece menu. Open a job posting and click the score badge.

          The extension reads only the page you're viewing and talks only to https://real-role.vercel.app.
          To update, unzip the new release over the same folder and click the reload icon on `chrome://extensions`.

          To check the download, compare `sha256sum real-role-extension-*-chrome.zip` with `SHA256SUMS`.
          EOF
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" "$zip" apps/extension/.output/SHA256SUMS \
            --title "Real Role $TAG" --notes-file notes.md $prerelease
