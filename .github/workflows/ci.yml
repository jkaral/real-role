name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      demo:
        description: "Also run the demo recording job"
        type: boolean
        default: false

# Least privilege for the GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check:agents
      - run: pnpm turbo run lint typecheck test
      - name: Release verifier tests
        run: node --test scripts/*.test.mjs
      - name: Build web app
        run: pnpm turbo run build --filter=@real-role/web

  e2e:
    name: e2e (extension + web)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @real-role/web build
      - run: pnpm --filter @real-role/extension exec playwright install --with-deps chromium
      - run: pnpm --filter @real-role/extension e2e
      - name: Build Chrome Web Store zip
        run: pnpm --filter @real-role/extension zip
      - uses: actions/upload-artifact@v4
        with:
          name: real-role-extension
          path: apps/extension/.output/*.zip
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: apps/extension/test-results

  # Optional demo job (A5), run manually with demo=true. Never blocks merges.
  # Prerequisites follow demo/README.md. Upload only the MP4: demo/output also
  # holds local databases and a session cookie.
  demo:
    name: demo recording (optional)
    if: github.event_name == 'workflow_dispatch' && inputs.demo
    needs: check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @real-role/demo exec playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-venv fonts-dejavu-core
      - run: python3 -m venv /tmp/real-role-tts && /tmp/real-role-tts/bin/pip install edge-tts
      - run: pnpm demo:video
        env:
          DEMO_PYTHON: /tmp/real-role-tts/bin/python
      - uses: actions/upload-artifact@v4
        with:
          name: real-role-demo
          path: demo/output/real-role-demo.mp4
          if-no-files-found: error
