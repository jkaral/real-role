name: Deployment smoke

# GET-only checks of the public production site (https://real-role.vercel.app): no secrets, no
# sign-in, no scoring, no writes. Manual for now; see docs/deployment-runbook.md.
on:
  workflow_dispatch:
    inputs:
      with_addons:
        description: "Also check the PR #24 add-on routes (/shortlist, /insights, /coach)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    name: public routes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Smoke-test production
        run: node scripts/deployment-smoke.mjs ${{ inputs.with_addons && '--with-addons' || '' }}
